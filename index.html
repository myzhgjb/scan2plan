<!DOCTYPE html>
<html lang="zh-CN"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Scan2Plan · 点云户型提取</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f6f7f9; --panel:#fff; --line:#e3e7ed; --tx:#1a1d23; --tx2:#5b6472; --tx3:#8b93a1;
  --acc:#2563eb; --acc2:#0ea5e9; --warn:#f59e0b; --ok:#10b981;
}
html,body{height:100%}
body{background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;font-size:13px;line-height:1.6;overflow:hidden}
#app{display:flex;flex-direction:column;height:100%}

header{height:54px;flex:0 0 auto;display:flex;align-items:center;gap:12px;padding:0 16px;background:var(--panel);border-bottom:1px solid var(--line);z-index:10}
.logo{width:26px;height:26px}
h1{font-size:14px;font-weight:600;letter-spacing:.2px}
h1 em{font-style:normal;font-size:12px;color:var(--tx3);font-weight:400;margin-left:8px}
.spacer{flex:1}
.metrics{display:flex;gap:16px;font-size:11.5px;color:var(--tx3)}
.metrics b{color:var(--tx);font-weight:600;font-variant-numeric:tabular-nums}
button{font-family:inherit;font-size:12px;height:30px;padding:0 12px;border-radius:6px;border:1px solid var(--line);background:#fff;color:var(--tx);cursor:pointer;transition:.15s}
button:hover{border-color:#c9d2de;background:#f8fafc}
button.primary{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
button.primary:hover{background:#1d4ed8}
button:disabled{opacity:.5;cursor:default}

main{flex:1;display:flex;min-height:0}
.pane{position:relative;min-width:0;display:flex;flex-direction:column}
.pane.left{flex:0 0 44%;border-right:1px solid var(--line)}
.pane.right{flex:1}
.ptitle{height:34px;display:flex;align-items:center;gap:8px;padding:0 12px;font-size:11.5px;color:var(--tx3);border-bottom:1px solid var(--line);background:var(--panel);flex:0 0 auto}
.ptitle b{color:var(--tx);font-weight:600;font-size:12px}
.ptitle .tag{font-size:10.5px;padding:1px 6px;border-radius:4px;background:#eef4ff;color:var(--acc);border:1px solid #dbe7ff}
.stage{flex:1;position:relative;min-height:0}
#gl{display:block;width:100%;height:100%;background:#0b0f14}
#plan{display:block;width:100%;height:100%}

.toolbar{position:absolute;left:12px;top:12px;right:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;
  background:rgba(255,255,255,.96);border:1px solid var(--line);border-radius:9px;padding:9px 11px;backdrop-filter:blur(6px);z-index:5}
.toolbar label{font-size:11px;color:var(--tx3);white-space:nowrap}
.toolbar input[type=range]{width:88px;accent-color:var(--acc)}
.toolbar select{height:26px;border:1px solid var(--line);border-radius:5px;background:#fff;color:var(--tx);font-size:11.5px;padding:0 6px;font-family:inherit}
.toolbar .val{font-size:11px;color:var(--tx);font-weight:600;font-variant-numeric:tabular-nums;min-width:34px;display:inline-block}
.chk{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--tx2);cursor:pointer;user-select:none}
.chk input{accent-color:var(--acc)}

.hud{position:absolute;left:14px;bottom:12px;font-size:10.5px;color:var(--tx3);line-height:1.7;pointer-events:none}
.hud b{color:var(--tx2);font-weight:600}

.stats{position:absolute;right:12px;bottom:12px;background:rgba(255,255,255,.96);border:1px solid var(--line);
  border-radius:9px;padding:10px 12px;font-size:11px;color:var(--tx2);min-width:150px;backdrop-filter:blur(6px)}
.stats .row{display:flex;justify-content:space-between;gap:14px;margin-bottom:3px}
.stats .row b{color:var(--tx);font-variant-numeric:tabular-nums}
.stats .hd{font-size:10px;color:var(--tx3);letter-spacing:.6px;margin-bottom:6px}

.badge{position:absolute;left:12px;top:64px;font-size:10.5px;background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;
  padding:5px 9px;border-radius:6px;line-height:1.5;z-index:4;max-width:220px}

.busy{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(255,255,255,.6);z-index:9;font-size:12px;color:var(--tx2)}
.busy.on{display:flex}

@media(max-width:900px){
  main{flex-direction:column}
  .pane.left{flex:0 0 38%;border-right:none;border-bottom:1px solid var(--line)}
  .metrics{display:none}
  .hud{display:none}
  .stats{display:none}
  .badge{display:none}
  .toolbar{left:8px;right:8px;top:8px;gap:7px;padding:7px}
  .toolbar input[type=range]{width:64px}
}
</style></head>
<body>
<div id="app">
  <header>
    <svg class="logo" viewBox="0 0 32 32"><rect x="3" y="3" width="26" height="26" rx="3" fill="none" stroke="#2563eb" stroke-width="1.6"/><path d="M3 11h26M3 21h26M11 3v26M21 3v26" stroke="#2563eb" stroke-width="0.7" opacity=".45"/><rect x="11" y="11" width="10" height="10" fill="#2563eb" opacity=".16"/></svg>
    <h1>Scan2Plan<em>点云 · 户型自动提取</em></h1>
    <div class="spacer"></div>
    <div class="metrics">
      <span>点数 <b id="mPts">—</b></span>
      <span>墙段 <b id="mWalls">—</b></span>
      <span>房间 <b id="mRooms">—</b></span>
      <span>耗时 <b id="mMs">—</b></span>
    </div>
    <button id="btnSvg">导出 SVG</button>
    <button id="btnJson">导出 JSON</button>
    <button class="primary" id="btnRun">重新提取</button>
  </header>

  <main>
    <section class="pane left">
      <div class="ptitle"><b>原始点云</b><span class="tag">133k 点</span><span style="margin-left:auto">左键旋转 · 滚轮缩放</span></div>
      <div class="stage">
        <canvas id="gl"></canvas>
        <div class="hud"><b>高亮部分</b>为参与计算的切片（0.3–1.6 m）<br>暗色为地面、天花与切片外点云</div>
      </div>
    </section>

    <section class="pane right">
      <div class="ptitle"><b>提取结果</b><span style="margin-left:auto" id="dirTxt">主方向 —</span></div>
      <div class="stage">
        <canvas id="plan"></canvas>
        <div class="toolbar">
          <label>切片</label>
          <input type="range" id="y0" min="0" max="2.4" step="0.05" value="0.30">
          <span class="val" id="y0v">0.30</span>
          <input type="range" id="y1" min="0.3" max="2.6" step="0.05" value="1.60">
          <span class="val" id="y1v">1.60</span>
          <label>分辨率</label>
          <select id="res"><option value="0.02">2 cm</option><option value="0.03" selected>3 cm</option><option value="0.05">5 cm</option></select>
          <label class="chk"><input type="checkbox" id="lyPts" checked>点云</label>
          <label class="chk"><input type="checkbox" id="lyGrid">栅格</label>
          <label class="chk"><input type="checkbox" id="lyRoom" checked>房间</label>
        </div>
        <div class="badge">数据为程序生成的演示户型（12×9 m，含门洞窗洞与家具），算法在浏览器里实时跑</div>
        <div class="stats">
          <div class="hd">提取结果</div>
          <div class="row"><span>房间数</span><b id="sRooms">—</b></div>
          <div class="row"><span>套内面积</span><b id="sArea">—</b></div>
          <div class="row"><span>墙段总长</span><b id="sLen">—</b></div>
          <div class="row"><span>墙段数</span><b id="sWalls">—</b></div>
          <div class="row"><span>算法耗时</span><b id="sMs">—</b></div>
          <div class="row" style="border-top:1px solid var(--line);padding-top:5px;margin-top:5px"><span>真值参照</span><b id="sTruth">108.0 ㎡</b></div>
          <div class="row"><span>面积误差</span><b id="sErr">—</b></div>
        </div>
        <div class="busy" id="busy">提取中…</div>
      </div>
    </section>
  </main>
</div>
<script src="three.min.js"></script>
<script src="app.js"></script>
</body></html>
